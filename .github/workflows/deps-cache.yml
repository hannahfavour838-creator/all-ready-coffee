name: deps-cache
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p /tmp/out
          tar -czf /tmp/out/deps.tgz node_modules package-lock.json
          cd /tmp/out && split -b 40m -d -a 2 deps.tgz part- && rm deps.tgz && sha256sum part-* > SHA256SUMS
          cp $GITHUB_WORKSPACE/package-lock.json /tmp/out/
          git init -q -b deps-cache
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "deps bundle"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deps-cache
